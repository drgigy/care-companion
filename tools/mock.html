<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated mock preview</title>
<style>body{font:18px system-ui;max-width:800px;margin:30px auto;padding:16px}button,a,select{padding:12px;display:inline-block;margin:8px}strong{color:#b33}</style>
<h1>Local mock preview</h1><p><strong>No production connection. All data is invented. Transcription returns a labelled sample.</strong></p>
<label>Mock login <select id="role"><option value="staff">Nursing staff</option><option value="administrator">Hospital administrator</option><option value="food">F&B administrator</option><option value="housekeeping">Housekeeping administrator</option></select></label>
<button id="seed">Reset mock requests</button><p id="status"></p>
<a href="../nursing-bot.html">Nursing recorder</a><a href="../dashboard.html">Common dashboard</a><a href="../F%26B-dashboard.html">F&B dashboard</a><a href="../Housekeeping-dashboard.html">Housekeeping dashboard</a><a href="../master-admin.html">Master Admin</a><a href="../log.html">Request log</a>
<script type="module">
const profiles={staff:{uid:'mock-staff',role:'staff',name:'Mock nurse',assignedRoomUids:['mock-room']},administrator:{uid:'mock-administrator',role:'administrator'},food:{uid:'mock-food',role:'departmentAdmin',department:'food'},housekeeping:{uid:'mock-housekeeping',role:'departmentAdmin',department:'housekeeping'}};
const select=document.getElementById('role');select.onchange=()=>{sessionStorage.setItem('mock-profile',JSON.stringify(profiles[select.value]));document.getElementById('status').textContent='Mock login selected: '+select.value;};select.onchange();
document.getElementById('seed').onclick=()=>{const rows=[['own-food','food','new','mock-room',null],['own-nursing','nursing','new','mock-room',null],['staff-clean','housekeeping','in-progress','nursing:mock-staff','mock-staff'],['other-food','food','new','other-room',null],['other-clean','housekeeping','new','other-room',null]].map(([id,category,status,ownerUid,submittedByUid],i)=>({id,category,status,ownerUid,...(submittedByUid?{submittedByUid,submittedVia:'nursing-bot'}:{}),room:String(1200+i),summary:'Mock service request '+(i+1),patientLanguage:'malayalam',createdAt:Date.now()-60000*(i+1),acknowledgedAt:status==='in-progress'?Date.now()-20000:null,completedAt:null,completedByName:null,completedByEmployeeId:null}));localStorage.setItem('care-companion-requests-v1',JSON.stringify(rows));document.getElementById('status').textContent='Five invented requests loaded.';};
if(!localStorage.getItem('care-companion-requests-v1'))document.getElementById('seed').click();
</script>
