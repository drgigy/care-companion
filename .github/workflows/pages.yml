name: Publish frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect public frontend files
        run: |
          mkdir public
          cp master-admin.html master-admin.css master-admin.js admin-client.js index.html dashboard.html log.html styles.css config.js shared.js patient.js dashboard.js request-alert.js log.js voice.js mic-worklet.js public/
          cp *-dashboard.html dashboard-scope.js patient-notification.js public/
          cp nursing-bot.html nursing-bot.js nursing-store.js nursing-voice.js public/
          cp access.js staff-store.js nursing-recorder.js nursing-mobile.css public/
          cp -R assets public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
